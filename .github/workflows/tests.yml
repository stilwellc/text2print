name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Previews render offscreen: on Linux with no display render.py asks for EGL, which Mesa provides in software.
      - name: Offscreen GL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgles2 libgl1-mesa-dri
      - name: Install
        run: pip install -r requirements.txt
      # The default run (pytest.ini) leaves out the "slicer" tests, which need Bambu Studio, and the "full" matrices.
      - name: Test
        run: python -m pytest -q
