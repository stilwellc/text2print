<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text2print</title>
<link rel="stylesheet" href="/static/app.css">
<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
             "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
</head>
<body>
<header class="top">
  <div class="brand">text2print</div>
  <button class="printer" id="printerBtn" aria-haspopup="dialog"><span class="dot" id="printerDot"></span><span id="printerName">Bambu Lab P2S</span></button>
  <nav class="topnav">
    <button class="ghost" id="savedBtn" aria-haspopup="dialog">Saved</button>
    <button class="ghost" id="platesBtn" aria-haspopup="dialog">Test plates</button>
  </nav>
  <div class="nozzle">
    <span class="label">Nozzle</span>
    <div class="seg" id="nozzles" role="radiogroup" aria-label="Nozzle"></div>
  </div>
</header>

<main class="app">
  <aside class="picker" aria-label="Design">
    <section>
      <h2>Shape</h2>
      <div class="cards" id="shapes"></div>
    </section>
    <section>
      <h2>Pattern</h2>
      <div class="seg small tabs" id="families" role="tablist" aria-label="Texture family"></div>
      <div id="textures"></div>
    </section>
    <section id="mixSec" hidden>
      <h2>Bands</h2>
      <div class="seg small" id="mixPresets" role="radiogroup" aria-label="Mix presets"></div>
      <p class="hint">Top of the list is the top of the piece. Drag the bar to set each band's height.</p>
      <div id="bands" class="bands"></div>
      <button class="ghost add" id="addBand">Add band</button>
    </section>
    <section>
      <h2>Size</h2>
      <div id="curve" class="curve" hidden></div>
      <div id="sizes" class="sizes"></div>
    </section>
    <section>
      <h2>Colour</h2>
      <div id="colours" class="colours"></div>
      <p class="hint" id="colourHint"></p>
    </section>
    <section id="finishSec" hidden>
      <h2>Finish</h2>
      <div id="finish"></div>
    </section>
  </aside>

  <section class="stage" aria-label="Preview">
    <canvas id="view"></canvas>
    <div class="status" id="status" hidden><span class="spin"></span><span id="statusText">Weaving…</span></div>
    <div class="dims" id="dims"></div>
    <div class="viewbtns">
      <div class="seg small" id="dropView" role="radiogroup" aria-label="Preview" hidden></div>
      <button class="ghost icon" id="spinBtn" aria-pressed="false" title="Spin" aria-label="Spin">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5v3.5H13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Spin</span></button>
      <button class="ghost icon" id="resetBtn" title="Reset view" aria-label="Reset view">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3.5" y="3.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2" fill="currentColor"/></svg><span>Reset view</span></button>
    </div>
    <div class="error" id="error" hidden></div>
  </section>

  <aside class="print" aria-label="Print">
    <h1 id="title">—</h1>
    <p class="blurb" id="blurb"></p>
    <dl class="stats" id="stats"></dl>
    <figure class="backlit" id="backlit" hidden></figure>
    <div class="slice" id="slice"></div>
    <div class="actions">
      <button class="primary" id="openBtn">Open in Bambu Studio</button>
      <button class="secondary" id="sendBtn" hidden>Send to printer</button>
      <button class="secondary" id="sliceBtn">Get exact print time</button>
      <div class="links">
        <a id="dl3mf" href="#">Download .3mf</a>
        <a id="dlStl" href="#">STLs</a>
        <button class="linkbtn" id="saveBtn">Save design</button>
      </div>
    </div>
    <ul class="notes" id="notes"></ul>
    <details class="settings">
      <summary>Print settings</summary>
      <dl id="settings"></dl>
    </details>
  </aside>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-card" id="sheetCard"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="popover" id="palette" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
